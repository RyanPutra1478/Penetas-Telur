<script>
        // Simple interactions
        let currentZoom = 1.0;
        function updateZoom(delta) {
            currentZoom = Math.max(1.0, Math.min(5.0, currentZoom + delta));
            document.getElementById('zoom-readout').textContent = currentZoom.toFixed(1) + 'x';
        }

        const recordBtn = document.getElementById('record-btn');
        const recordIcon = document.getElementById('record-icon');
        let isRecording = false;

        recordBtn.addEventListener('click', () => {
            isRecording = !isRecording;
            if (isRecording) {
                recordIcon.classList.add('led-active');
                recordIcon.classList.remove('text-error');
                recordIcon.style.color = '#ffb4ab'; // light red for active
                recordBtn.style.boxShadow = 'inset 2px 2px 4px rgba(0, 0, 0, 0.6)'; // look pressed
            } else {
                recordIcon.classList.remove('led-active');
                recordIcon.classList.add('text-error');
                recordIcon.style.color = '';
                recordBtn.style.boxShadow = ''; // restore normal
            }
        });
    </script>
