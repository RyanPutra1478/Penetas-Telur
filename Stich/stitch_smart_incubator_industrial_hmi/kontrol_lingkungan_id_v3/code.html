        .panel-recessed {

            box-shadow: inset 2px 2px 0px rgba(255, 255, 255, 0.1),

                        inset -1px -1px 0px rgba(0,0,0,0.3);
            border: 1px solid #444748;
            transition: all 0.1s ease;

            background: #1e2020;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.6);
            transform: translate(1px, 1px);

        .led-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #00390a;
            box-shadow: inset 1px 1px 2px rgba(0,0,0,0.5);
            transition: all 0.3s ease;

        .led-indicator.active {

<script>
        let currentTemp = 37.5;
        let currentHum = 65;
        let isAuto = true;

        function adjustTemp(amount) {
            currentTemp += amount;
            document.getElementById('temp-display').innerHTML = currentTemp.toFixed(1) + '&deg;';
        }

        function adjustHum(amount) {
            currentHum += amount;
            document.getElementById('hum-display').innerText = currentHum + '%';
        }

        function toggleMode() {
            isAuto = !isAuto;
            const handle = document.getElementById('mode-handle');
            const autoLabel = document.getElementById('mode-auto-label');
            const manualLabel = document.getElementById('mode-manual-label');

            if (isAuto) {
                handle.style.transform = 'translateY(0)';
                autoLabel.classList.add('text-tertiary');
                autoLabel.classList.remove('text-on-surface-variant');
                manualLabel.classList.remove('text-error');
                manualLabel.classList.add('text-on-surface-variant');
            } else {
                handle.style.transform = 'translateY(48px)';
                autoLabel.classList.remove('text-tertiary');
                autoLabel.classList.add('text-on-surface-variant');
                manualLabel.classList.add('text-error');
                manualLabel.classList.remove('text-on-surface-variant');
            }
        }
    </script>
